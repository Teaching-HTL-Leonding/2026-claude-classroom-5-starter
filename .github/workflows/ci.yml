name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Also builds the CLI through its `prepare` script.
      - run: npm ci

      # Nothing here calls a model: the LLM spec is skipped (no E2E_LLM), so
      # the OpenRouter key is a placeholder and the auth secret is throwaway.
      - name: Write .env
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          cat > .env <<EOF
          DATABASE_URL=file:./data/app.db
          OPENROUTER_API_KEY=sk-or-v1-ci-placeholder
          BETTER_AUTH_SECRET=$secret
          BETTER_AUTH_URL=http://localhost:3000
          EOF

      - run: npm run lint

      - run: npm test

      - run: npm run db:migrate

      # `prebuild` also bundles the MCP App views the e2e server reads.
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The config's reporter is `list` only; add `html` so a failure leaves a
      # report to upload. The HTML reporter never tries to open itself on CI.
      - name: Playwright
        run: npm run test:e2e -- --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
